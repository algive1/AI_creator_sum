services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_creator
      MYSQL_USER: ai_creator
      MYSQL_PASSWORD: ai_creator_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    # init-connect 统一非 root 连接的 collation，与迁移文件临时表（DEFAULT CHARSET=utf8mb4 → 0900_ai_ci）保持一致，避免迁移时 collation 冲突。
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--init-connect=SET NAMES utf8mb4 COLLATE utf8mb4_0900_ai_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_dev_only"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ai_creator_mysql:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ai_creator_redis:/data

  api:
    image: node:20-bookworm-slim
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run db:migrate && npm run dev"]
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ai_creator
      DB_USER: ai_creator
      DB_PASSWORD: ai_creator_dev
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-development-jwt-secret-change-before-production
      ENCRYPTION_KEY: local-development-encryption-key-change-before-production
      STORAGE_PROVIDER: local
      LOCAL_UPLOAD_DIR: /app/.data/uploads
      LOCAL_BASE_URL: http://127.0.0.1:3000/static
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ai_creator_node_modules:/app/node_modules
      - ai_creator_uploads:/app/.data/uploads

volumes:
  ai_creator_mysql:
  ai_creator_redis:
  ai_creator_node_modules:
  ai_creator_uploads:
